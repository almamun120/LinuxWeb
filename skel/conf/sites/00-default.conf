server {
    listen @BIND@:@HTTP_PORT@ default_server;
    listen @BIND@:@HTTPS_PORT@ ssl default_server;
    listen @BIND@:@HTTPS_PORT@ quic reuseport default_server;
    http2 on;
    server_name _;
    ssl_certificate     "@DATA@/ssl/default.crt";
    ssl_certificate_key "@DATA@/ssl/default.key";
    add_header Alt-Svc 'h3=":@HTTPS_PORT@"; ma=86400' always;
    root "@ROOT@/www/default";
    index index.php index.html;
    include "@RUN@/nginx/live-locations.conf";
    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ {
        try_files $uri =404;
        include "@ROOT@/nginx/conf/fastcgi_params";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:@SOCK@/php-@DEFAULT_PHP@.sock;
    }
    location ~ /\.(?!well-known) { deny all; }
}
