# lsrv কনফিগ — `lsrv config set KEY VALUE` দিয়েও বদলানো যায়
BIND=0.0.0.0
HTTP_PORT=8080          # 80 লাগলে root হিসেবে চালান বা: sysctl net.ipv4.ip_unprivileged_port_start=80
HTTPS_PORT=8443         # TCP (HTTP/1.1, HTTP/2) + UDP (HTTP/3) দুটোই এই পোর্টে
DEFAULT_PHP=8.3
ENABLE_MYSQL=1
MYSQL_BIND=127.0.0.1
MYSQL_PORT=3306
ENABLE_RTMP=0           # RTMP + HLS + DASH (http://host:PORT/hls/<key>.m3u8, /dash/<key>/index.mpd)
RTMP_PORT=1935
ENABLE_OTEL=0
RUN_USER=               # ফাঁকা = ROOT ফোল্ডারের মালিক (root হলে nobody)
DATA_DIR=               # ফাঁকা = <ROOT>/data ; MySQL data অন্য ডিস্কে রাখতে চাইলে পাথ দিন (ext4/xfs/btrfs)
ENABLE_RTMPS=0          # RTMPS (TLS) — ENABLE_RTMP=1 লাগবে; নিজের আসল সার্টিফিকেট data/ssl/default.crt|key এ বসান
RTMPS_PORT=1936
