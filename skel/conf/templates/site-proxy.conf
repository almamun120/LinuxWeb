server {
    listen @BIND@:@HTTP_PORT@;
    listen @BIND@:@HTTPS_PORT@ ssl;
    listen @BIND@:@HTTPS_PORT@ quic;
    http2 on;
    server_name __SERVER__;
    ssl_certificate     "@DATA@/ssl/default.crt";
    ssl_certificate_key "@DATA@/ssl/default.key";
    add_header Alt-Svc 'h3=":@HTTPS_PORT@"; ma=86400' always;
    access_log "@LOGS@/__NAME__.access.log";
    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
