server {
    listen @BIND@:@HTTP_PORT@;
    listen @BIND@:@HTTPS_PORT@ ssl;
    listen @BIND@:@HTTPS_PORT@ quic;
    http2 on;
    server_name __SERVER__;
    ssl_certificate     "@DATA@/ssl/default.crt";
    ssl_certificate_key "@DATA@/ssl/default.key";
    add_header Alt-Svc 'h3=":@HTTPS_PORT@"; ma=86400' always;
    access_log "@LOGS@/__NAME__.access.log";
    root "@ROOT@/www/__NAME__";
    index index.php index.html;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        try_files $fastcgi_script_name =404;
        include "@ROOT@/nginx/conf/fastcgi_params";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:@SOCK@/php-__VER__.sock;
    }
    location ~ /\.(?!well-known) { deny all; }
}
